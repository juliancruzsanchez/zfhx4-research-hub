name: Lint PR title

# Enforce Conventional Commits on every PR title. Mirrors the local
# commitlint rules so contributors get the same feedback on `git commit`
# (via .husky/commit-msg) and on PRs.
#
# Reference: https://github.com/conventional-changelog/commitlint

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title against Conventional Commits
        uses: wagoid/commitlint-github-action@v5
        with:
          configFile: commitlint.config.cjs
          # Limit the regex to a per-PR context so failures are actionable.
          helpURL: "https://www.conventionalcommits.org/en/v1.0.0/"
          # Skip detection of issue references — we already document the
          # Closes #N pattern in the PR template.
          detectMergeCommit: false
